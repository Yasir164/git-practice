<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>📝 Yasir's Team Notes</h1>
    <p class="sub">A shared board for practising Git and GitHub teamwork.</p>

    <form id="note-form">
      <input id="author" placeholder="Your name" maxlength="40">
      <textarea id="text" placeholder="Write a note…" maxlength="500" required></textarea>
      <button type="submit">Add note</button>
    </form>

    <p id="error" class="error" hidden></p>
    <input id="search" type="search" placeholder="Search notes by text or name…">
    <p id="count" class="count"></p>
    <ul id="notes"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
